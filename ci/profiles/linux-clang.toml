# A configuration CI builds. The runner's compiler has to be this kind and generation:
# the major version for gcc and clang, 14.5x for MSVC.
[settings]
os = "linux"
arch = "x86_64"
cppstd = 20

[compiler]
kind = "clang"
executable = "clang"
cxx_executable = "clang++"
version = "18"
target = "x86_64-linux-gnu"

# Read by ci/plan.py, not by silo. CMake scans C++20 sources for modules, which clang does
# with clang-scan-deps.
[ci]
apt = ["clang-tools"]
