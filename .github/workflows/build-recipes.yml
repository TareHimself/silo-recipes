name: Build affected recipes

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-recipes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Find affected recipes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: registry
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: TareHimself/silo
          path: silo
      - uses: astral-sh/setup-uv@v6

      # A pull request builds what it reaches. A manual run builds every recipe.
      - id: plan
        working-directory: registry
        env:
          SCOPE: ${{ github.event_name == 'pull_request' && format('--since origin/{0}', github.base_ref) || '--all' }}
        run: |
          matrix=$(uv run --project ../silo --package silo python ci/plan.py $SCOPE)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.recipe }} (${{ matrix.profile }})
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.matrix).include[0] != null }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: registry
      - uses: actions/checkout@v5
        with:
          repository: TareHimself/silo
          path: silo
      - uses: astral-sh/setup-uv@v6

      - working-directory: registry
        run: uv run --project ../silo --package silo silo profile detect --matching ci/profiles/${{ matrix.profile }}.toml
      - working-directory: registry
        run: uv run --project ../silo --package silo silo build ${{ matrix.recipe }}
